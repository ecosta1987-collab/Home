<html lang="it">

<meta charset="UTF-8">

<style>
:root{
  --bg:#f6fbf7;
  --card:#ffffff;
  --ink:#243348;
  --muted:#6d7888;
  --primary:#665ce8;
  --primary-dark:#4e45c4;
  --soft:#efedff;
  --green:#23986a;
  --green-soft:#e7f8ef;
  --orange:#d87b19;
  --orange-soft:#fff1df;
  --shadow:0 14px 36px rgba(46,65,84,.14);
  --radius:26px;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(circle at 10% 10%,#fff3bd 0 6%,transparent 7%),
    radial-gradient(circle at 90% 14%,#dff7ff 0 7%,transparent 8%),
    radial-gradient(circle at 90% 90%,#eee7ff 0 8%,transparent 9%),
    var(--bg);
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible{
  outline:4px solid rgba(102,92,232,.25);
  outline-offset:3px;
}

.app{
  width:min(100%,980px);
  margin:auto;
  padding:18px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:56px;
  height:56px;
  border-radius:19px;
  background:white;
  display:grid;
  place-items:center;
  font-size:31px;
  box-shadow:var(--shadow);
}

.title{
  font-size:clamp(1.25rem,4vw,1.85rem);
  font-weight:950;
}

.subtitle{
  color:var(--muted);
  font-size:.9rem;
  font-weight:700;
}

.headerButtons{
  display:flex;
  gap:8px;
}

.smallButton{
  border:0;
  background:white;
  padding:11px 14px;
  border-radius:999px;
  font-weight:850;
  cursor:pointer;
  color:var(--ink);
  box-shadow:0 6px 18px rgba(46,65,84,.10);
}

/* PROGRESS */

.progressCard{
  background:white;
  border-radius:20px;
  padding:15px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.progressTop{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-weight:900;
  margin-bottom:9px;
}

.progressTrack{
  background:#e9edf2;
  height:16px;
  border-radius:999px;
  overflow:hidden;
}

.progressBar{
  width:0%;
  height:100%;
  background:linear-gradient(
    90deg,
    #675ce8,
    #8b72ff
  );
  transition:.35s ease;
}

/* GAME */

.game{
  background:rgba(255,255,255,.97);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:clamp(22px,5vw,46px);
  text-align:center;
}

.missionBadge{
  display:inline-flex;
  align-items:center;
  gap:9px;
  border-radius:999px;
  background:var(--soft);
  color:#5047bf;
  font-weight:950;
  padding:9px 15px;
  margin-bottom:14px;
}

.animal{
  font-size:clamp(4rem,14vw,6.5rem);
  line-height:1;
  margin:7px 0;
}

.instruction{
  color:var(--muted);
  font-weight:800;
  font-size:clamp(1rem,3vw,1.15rem);
  margin:10px auto 18px;
  max-width:700px;
}

.readingText{
  font-size:clamp(2.4rem,10vw,5.4rem);
  line-height:1.15;
  font-weight:950;
  letter-spacing:.02em;
  margin:20px auto 28px;
  max-width:850px;
}

.readingText.sentence{
  font-size:clamp(1.65rem,6vw,3.4rem);
  line-height:1.3;
}

.readingText.story{
  font-size:clamp(1.35rem,4.7vw,2.45rem);
  line-height:1.48;
  max-width:800px;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.listenButton,
.helpButton,
.pauseButton{
  border:0;
  border-radius:17px;
  padding:12px 16px;
  font-weight:900;
  cursor:pointer;
}

.listenButton{
  background:#e8f6ff;
  color:#216185;
}

.helpButton{
  background:#fff2da;
  color:#985b13;
}

.pauseButton{
  background:#edf8f1;
  color:#277356;
}

/* ANSWERS */

.answers{
  max-width:740px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.answerButton{
  min-height:76px;
  border:3px solid #e4e8ee;
  border-radius:21px;
  background:white;
  padding:12px 16px;
  cursor:pointer;
  font-weight:950;
  font-size:clamp(1.18rem,4vw,1.8rem);
  color:var(--ink);

  transition:
    transform .12s,
    border-color .12s,
    background .12s;
}

.answerButton:active{
  transform:scale(.97);
}

.answerButton.correct{
  border-color:#5fc798;
  background:var(--green-soft);
  color:#15714d;
}

.answerButton.wrong{
  border-color:#f0bc73;
  background:var(--orange-soft);
  color:#9a5e18;
}

.feedback{
  min-height:62px;
  display:grid;
  place-items:center;
  padding-top:16px;
  font-size:1.15rem;
  font-weight:900;
}

.feedback.good{
  color:var(--green);
}

.feedback.try{
  color:var(--orange);
}

.feedback.normal{
  color:#526174;
}

/* PAUSE */

.pauseBox{
  display:none;
  max-width:650px;
  margin:15px auto 0;
  padding:17px;
  border-radius:20px;
  background:#f2fbf5;
  color:#3c6652;
  border:2px dashed #9ad5b4;
  font-weight:800;
  line-height:1.45;
}

.pauseBox.show{
  display:block;
}

/* MAP */

.map{
  background:white;
  border-radius:23px;
  box-shadow:var(--shadow);
  padding:18px;
  margin-top:18px;
}

.mapTitle{
  font-weight:950;
  margin-bottom:14px;
}

.animalsMap{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:8px;
}

.animalDot{
  border-radius:15px;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  font-size:1.65rem;
  background:#edf1f5;
  opacity:.55;
  position:relative;
}

.animalDot.current{
  background:#ece9ff;
  opacity:1;
  box-shadow:0 0 0 4px rgba(102,92,232,.13);
}

.animalDot.done{
  background:#e7f8ef;
  opacity:1;
}

.check{
  position:absolute;
  right:-3px;
  top:-5px;
  font-size:.75rem;
  background:#23986a;
  color:white;
  width:21px;
  height:21px;
  display:grid;
  place-items:center;
  border-radius:50%;
}

.stars{
  min-height:38px;
  margin-top:10px;
  letter-spacing:3px;
  font-size:1.65rem;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(28,38,50,.40);
  z-index:100;
  padding:20px;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(100%,560px);
  background:white;
  padding:30px;
  border-radius:29px;
  box-shadow:0 25px 80px rgba(0,0,0,.20);
  text-align:center;
}

.modalEmoji{
  font-size:72px;
}

.modal h2{
  font-size:clamp(1.8rem,7vw,2.5rem);
  margin:4px 0 8px;
}

.modal p{
  color:var(--muted);
  font-size:1.08rem;
  line-height:1.5;
  font-weight:750;
}

.primaryButton{
  margin-top:15px;
  width:100%;
  border:0;
  border-radius:19px;
  padding:17px;
  font-weight:950;
  color:white;
  background:var(--primary);
  box-shadow:0 7px 0 var(--primary-dark);
  font-size:1.1rem;
  cursor:pointer;
}

.primaryButton:active{
  transform:translateY(4px);
  box-shadow:0 3px 0 var(--primary-dark);
}

/* FOCUS */

.focus .map{
  display:none;
}

.focus .game{
  max-width:760px;
  margin:auto;
}

/* CONFETTI */

.confetti{
  position:fixed;
  top:-40px;
  z-index:200;
  font-size:26px;
  pointer-events:none;
  animation:fall 1.7s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(600deg);
    opacity:.15;
  }
}

@media(max-width:720px){

  .animalsMap{
    grid-template-columns:repeat(5,1fr);
  }

  .answers{
    grid-template-columns:1fr;
  }

  .answerButton{
    min-height:68px;
  }

  .headerButtons{
    width:100%;
  }

  .smallButton{
    flex:1;
  }
}
</style>
</head>

/* ======================================================

   ====================================================== */

let state = {

  index:0,
  stars:0,
  levelStars:0,
  focus:false,
  locked:false

};


/* ======================================================
   ELEMENTI
   ====================================================== */

const $ =
  id =>
    document.getElementById(id);


const missionBadge =
  $("missionBadge");

const animalEmoji =
  $("animalEmoji");

const instruction =
  $("instruction");

const readingText =
  $("readingText");

const answers =
  $("answers");

const feedback =
  $("feedback");

const progressText =
  $("progressText");

const progressBar =
  $("progressBar");

const starText =
  $("starText");

const levelStars =
  $("levelStars");

const overlay =
  $("overlay");

const modalEmoji =
  $("modalEmoji");

const modalTitle =
  $("modalTitle");

const modalText =
  $("modalText");

const continueButton =
  $("continueButton");


/* ======================================================
   SALVATAGGIO
   ====================================================== */

function saveProgress(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      index:state.index,
      stars:state.stars
    })
  );

}


function loadProgress(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      );


    if(
      saved &&
      Number.isInteger(
        saved.index
      ) &&
      saved.index >= 0 &&
      saved.index <= TOTAL
    ){

      state.index =
        saved.index;


      state.stars =
        Number(
          saved.stars
        ) || 0;


      state.levelStars =
        state.index %
        PER_LEVEL;

    }

  }

  catch(e){}

}


/* ======================================================
   LIVELLO
   ====================================================== */

function getLevel(){

  return Math.min(
    9,
    Math.floor(
      state.index /
      PER_LEVEL
    )
  );

}


/* ======================================================
   RANDOMIZZA RISPOSTE
   ====================================================== */

function shuffle(array){

  const copy =
    [...array];


  for(
    let i =
      copy.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


/* ======================================================
   MAPPA
   ====================================================== */

function renderMap(){

  const map =
    $("animalsMap");


  map.innerHTML =
    "";


  const currentLevel =
    getLevel();


  animals.forEach(
    (animal,index)=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "animalDot";


      if(
        index < currentLevel
      ){

        item.classList.add(
          "done"
        );

      }


      if(
        index === currentLevel
      ){

        item.classList.add(
          "current"
        );

      }


      item.textContent =
        animal.emoji;


      if(
        index < currentLevel
      ){

        const check =
          document.createElement(
            "span"
          );


        check.className =
          "check";


        check.textContent =
          "✓";


        item.appendChild(
          check
        );

      }


      map.appendChild(
        item
      );

    }
  );

}


/* ======================================================
   RENDER
   ====================================================== */

function render(){

  state.locked =
    false;


  if(
    state.index >= TOTAL
  ){

    finishGame();

    return;

  }


  const activity =
    activities[
      state.index
    ];


  const level =
    getLevel();


  const animal =
    animals[level];


  missionBadge.textContent =
    `${animal.emoji} Missione ${level + 1}: ${animal.title}`;


  animalEmoji.textContent =
    animal.emoji;


  instruction.textContent =
    activity.instruction;


  readingText.textContent =
    activity.text;


  readingText.classList.remove(
    "sentence",
    "story"
  );


  if(
    activity.type === "story"
  ){

    readingText.classList.add(
      "story"
    );

  }

  else if(
    activity.text.length > 16
  ){

    readingText.classList.add(
      "sentence"
    );

  }


  progressText.textContent =
    `Missione ${state.index + 1} di ${TOTAL}`;


  progressBar.style.width =
    `${state.index}%`;


  starText.textContent =
    `⭐ ${state.stars}`;


  levelStars.textContent =
    "⭐".repeat(
      state.levelStars
    );


  feedback.className =
    "feedback normal";


  if(level <= 4){

    feedback.textContent =
      "Una parola alla volta. Nessuna fretta.";

  }

  else{

    feedback.textContent =
      "Leggi con calma e cerca gli indizi nella frase.";

  }


  renderAnswers(
    activity
  );


  renderMap();


  saveProgress();

}


/* ======================================================
   RISPOSTE
   ====================================================== */

function renderAnswers(
  activity
){

  answers.innerHTML =
    "";


  const randomizedAnswers =
    shuffle(
      activity.answers
    );


  randomizedAnswers.forEach(
    answer=>{

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "answerButton";


      button.type =
        "button";


      button.textContent =
        answer;


      button.addEventListener(
        "click",
        () =>
          checkAnswer(
            answer,
            button
          )
      );


      answers.appendChild(
        button
      );

    }
  );

}


/* ======================================================
   RISPOSTA
   ====================================================== */

function checkAnswer(
  answer,
  button
){

  if(
    state.locked
  ){
    return;
  }


  const activity =
    activities[
      state.index
    ];


  if(
    answer ===
    activity.correct
  ){

    state.locked =
      true;


    button.classList.add(
      "correct"
    );


    state.stars++;

    state.levelStars++;


    starText.textContent =
      `⭐ ${state.stars}`;


    levelStars.textContent =
      "⭐".repeat(
        state.levelStars
      );


    feedback.className =
      "feedback good";


    feedback.textContent =
      randomGoodMessage();


    playTone(
      true
    );


    setTimeout(
      ()=>{

        state.index++;


        saveProgress();


        if(
          state.index %
            PER_LEVEL ===
            0 &&
          state.index <
            TOTAL
        ){

          showLevelComplete();

        }

        else{

          render();

        }

      },
      700
    );

  }

  else{

    button.classList.add(
      "wrong"
    );


    feedback.className =
      "feedback try";


    feedback.textContent =
      randomTryMessage();


    playTone(
      false
    );


    setTimeout(
      ()=>{

        button.classList.remove(
          "wrong"
        );

      },
      650
    );

  }

}

   MESSAGGI
   ====================================================== */

function randomGoodMessage(){

  const messages = [

    "🌟 Grande! Missione riuscita!",

    "🎉 Esatto! Continua così!",

    "🦋 Perfetto! Hai trovato la risposta!",

    "🚀 Super lettore!",

    "✨ Giusto! Un'altra stella!"

  ];


  return messages[
    Math.floor(
      Math.random() *
      messages.length
    )
  ];

}


function randomTryMessage(){

  const messages = [

    "🙂 Quasi! Rileggi con calma.",

    "🌱 Nessun problema. Cerca un indizio nel testo.",

    "💪 Puoi riprovare: non perdi nulla.",

    "👀 Guarda bene la frase e prova ancora.",

    "🧩 Quale parola del testo può aiutarti?"

  ];


  return messages[
    Math.floor(
      Math.random() *
      messages.length
    )
  ];

}

   ====================================================== */

$("listenButton")
  .addEventListener(
    "click",
    speakCurrent
  );


function speakCurrent(){

  if(
    !(
      "speechSynthesis"
      in window
    )
  ){

    feedback.textContent =
      "🔇 La voce non è disponibile su questo browser.";

    return;

  }


  if(
    state.index >= TOTAL
  ){
    return;
  }


  const activity =
    activities[
      state.index
    ];


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      activity.text
    );


  utterance.lang =
    "it-IT";


  utterance.rate =
    activity.type === "story"
      ? 0.78
      : 0.72;


  utterance.pitch =
    1.03;


  speechSynthesis.speak(
    utterance
  );

}


/* ======================================================
   SUONI
   ====================================================== */

function playTone(
  correct
){

  try{

    const ctx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      correct
        ? 660
        : 250;


    gain.gain.value =
      .04;


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    oscillator.start();


    setTimeout(
      ()=>{

        oscillator.stop();

        ctx.close();

      },
      correct
        ? 130
        : 90
    );

  }

  catch(e){}

}


/* ======================================================
   PAUSA
   ====================================================== */

$("pauseButton")

            )

    }

/* ======================================================
   FOCUS
   ====================================================== */

$("focusButton")
  .addEventListener(
    "click",
    ()=>{

      state.focus =
        !state.focus;


      $("app")
        .classList
        .toggle(
          "focus",
          state.focus
        );


      $("focusButton")
        .textContent =
          state.focus
            ? "🗺️ Mappa"
            : "🎯 Focus";

    }
  );


/* ======================================================
   RESET
   ====================================================== */

$("resetButton")
  .addEventListener(
    "click",
    ()=>{

      const ok =
        confirm(
          "Vuoi ricominciare dal Coniglio e cancellare il progresso?"
        );


      if(
        !ok
      ){
        return;
      }


      localStorage.removeItem(
        STORAGE_KEY
      );


      state.index =
        0;


      state.stars =
        0;


      state.levelStars =
        0;


      location.reload();

    }
  );


/* ======================================================
   LIVELLO COMPLETATO
   ====================================================== */

function showLevelComplete(){

  const completedLevel =
    state.index /
    PER_LEVEL;


  const completedAnimal =
    animals[
      completedLevel - 1
    ];


  const nextAnimal =
    animals[
      completedLevel
    ];


  confetti();


  modalEmoji.textContent =
    completedAnimal.emoji +
    " ⭐";


  modalTitle.textContent =
    "Missione completata!";


  modalText.textContent =
    `Hai aiutato ${completedAnimal.name}! Ora ${nextAnimal.emoji} ${nextAnimal.name} ti aspetta con una nuova avventura.`;


  continueButton.textContent =
    `Vai da ${nextAnimal.emoji} ${nextAnimal.name}`;


  overlay.classList.add(
    "show"
  );


  state.levelStars =
    0;

}


/* ======================================================
   CONTINUA
   ====================================================== */

continueButton
  .addEventListener(
    "click",
    ()=>{

      overlay.classList.remove(
        "show"
      );


      if(
        state.index >= TOTAL
      ){

        localStorage.removeItem(
          STORAGE_KEY
        );


        state.index =
          0;


        state.stars =
          0;


        state.levelStars =
          0;

      }


      render();

    }
  );


/* ======================================================
   FINALE
   ====================================================== */

function finishGame(){

  progressBar.style.width =
    "100%";


  progressText.textContent =
    "100 missioni completate!";


  missionBadge.textContent =
    "🏆 Grande Lettore del Bosco";


  animalEmoji.textContent =
    "🦁";


  instruction.textContent =
    "Hai aiutato tutti gli animali!";


  readingText.textContent =
    "MISSIONE COMPLETATA";


  readingText.classList.remove(
    "story"
  );


  readingText.classList.add(
    "sentence"
  );


  answers.innerHTML =
    "";


  levelStars.textContent =
    "";


  feedback.className =
    "feedback good";


  feedback.textContent =
    "🌟 Hai letto parole, frasi e storie e hai cercato gli indizi nel testo!";


  renderMap();


  confetti();


  modalEmoji.textContent =
    "🏆🌳";


  modalTitle.textContent =
    "Grande Lettore del Bosco!";


  modalText.textContent =
    `Hai completato tutte le 100 missioni e conquistato ${state.stars} stelle. Hai imparato non soltanto a leggere, ma anche a capire ciò che leggi!`;


  continueButton.textContent =
    "Gioca di nuovo 🌳";


  overlay.classList.add(
    "show"
  );

}


/* ======================================================
   CONFETTI
   ====================================================== */

function confetti(){

  const symbols = [

    "⭐",
    "🌿",
    "✨",
    "🦋",
    "🌸"

  ];


  for(
    let i = 0;
    i < 18;
    i++
  ){

    const el =
      document.createElement(
        "span"
      );


    el.className =
      "confetti";


    el.textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


    el.style.left =
      (
        5 +
        Math.random() *
        90
      ) +
      "vw";


    el.style.animationDelay =
      (
        Math.random() *
        .3
      ) +
      "s";


    document.body.appendChild(
      el
    );


    setTimeout(
      ()=>el.remove(),
      2100
    );

  }

}
